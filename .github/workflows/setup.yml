name: 1. Setup Folder Sistem (Sekali Saja)

on:
  workflow_dispatch: # Fitur ini memunculkan tombol "Run" manual di GitHub

jobs:
  generate-folders:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Mengizinkan robot untuk menyimpan file ke repo Kak Agus

    steps:
      - name: Tarik Data Repositori
        uses: actions/checkout@v4

      - name: Siapkan Mesin Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Bikin Folder Android, Mac, Windows
        run: flutter create . --platforms=android,windows,macos

      - name: Simpan (Push) ke GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto-generate folder sistem Android, Mac, Windows"
          git push
