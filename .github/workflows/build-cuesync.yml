name: Build CueSync (Mac, Windows, Android)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: macos
            artifact_name: CueSync-Mac
            artifact_path: build/macos/Build/Products/Release/CueSync.app
          - os: windows-latest
            target: windows
            artifact_name: CueSync-Windows
            artifact_path: build/windows/*/runner/Release/*
          - os: ubuntu-latest
            target: apk
            artifact_name: CueSync-Android
            artifact_path: build/app/outputs/flutter-apk/app-release.apk

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4 # Diperbarui ke v4

      - name: Setup Java (Untuk Android)
        if: matrix.target == 'apk'
        uses: actions/setup-java@v4 # Diperbarui ke v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Application
        run: flutter build ${{ matrix.target }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4 # Diperbarui ke v4 (Ini yang menyelesaikan error)
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
