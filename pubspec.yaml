name: cuesync
description: Agasta Show Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter
  shelf: ^1.4.1
  shelf_web_socket: ^1.0.4
  web_socket_channel: ^2.4.4
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"

flutter_icons:
  android: true
  ios: true
  image_path: "icon.png"
  macos:
    generate: true
    image_path: "icon.png"
  windows:
    generate: true
    image_path: "icon.png"

flutter:
  uses-material-design: true
